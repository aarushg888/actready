name: ci

on: [push, pull_request]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: actready
          POSTGRES_PASSWORD: actready
          POSTGRES_DB: actready
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U actready -d actready"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql+asyncpg://actready:actready@localhost:5432/actready"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python and sync dependencies
        run: |
          uv python install 3.11
          uv sync

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type-check (mypy)
        run: uv run mypy .

      - name: Tests with coverage gate
        run: uv run pytest --cov=app --cov-fail-under=80 -q
