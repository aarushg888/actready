[project]
name = "actready-api"
version = "0.1.0"
description = "ActReady — AI-governance evidence compiler: map evidence to ISO/IEC 42001 controls and EU AI Act obligations, output scored gap reports."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aarush Gutha" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "instructor>=1.4",
    "openai>=1.40",
    "pyyaml>=6.0",
    "rich>=13.7",
    "httpx>=0.27",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.1",
    "pyjwt>=2.8",
    "passlib[bcrypt]>=1.7",
    "sentence-transformers>=2.5",
    "pgvector>=0.3",
    "greenlet>=3.0",
    "email-validator>=2.0",
    "pytest-asyncio>=0.23",
    "bcrypt<4.1",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.pycodestyle]
max-line-length = 120

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["yaml", "instructor", "openai", "fastapi.*"]
ignore_missing_imports = true

# Heavy ML deps ship 3.12+ syntax / large untyped stubs; we only type-check our
# own code, mirroring the existing engine-dep ignore policy. (M4: sentence-transformers)
[[tool.mypy.overrides]]
module = ["numpy.*", "torch.*", "transformers.*", "sentence_transformers.*", "pgvector.*", "scipy.*", "sklearn.*", "huggingface_hub.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
