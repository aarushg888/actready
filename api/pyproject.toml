[project]
name = "actready-api"
version = "0.1.0"
description = "ActReady — AI-governance evidence compiler: map evidence to ISO/IEC 42001 controls and EU AI Act obligations, output scored gap reports."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aarush Gutha" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "instructor>=1.4",
    "openai>=1.40",
    "pyyaml>=6.0",
    "rich>=13.7",
    "httpx>=0.27",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.1",
    "pyjwt>=2.8",
    "passlib[bcrypt]>=1.7",
    "sentence-transformers>=2.5",
    "pgvector>=0.3",
    "greenlet>=3.0",
    "email-validator>=2.0",
    "pytest-asyncio>=0.23",
    "bcrypt<4.1",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
# B008: `Depends()` in FastAPI route signatures is the documented idiom, not a
# real call in a default. B017/B905: test-only lint niceties (blind except in a
# tests/ML test, zip strictness) that are safe in test code.
ignore = ["B008", "B017", "B905"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated Alembic migrations: long generated SQL strings + trailing ws.
"migrations/**" = ["E501", "W291"]
# Test files: migrations-style long assertion lines are acceptable.
"tests/integration/test_integrations_eval_health.py" = ["E501"]
# ML test suite is out of scope for this stabilization (brief: do not modify ML
# tests); leave its imports/fmt as-is.
"tests/ml/**" = ["F401", "I001"]

[tool.ruff.lint.pycodestyle]
max-line-length = 120

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["yaml", "instructor", "openai", "fastapi.*", "passlib.*", "weasyprint.*"]
ignore_missing_imports = true

# Heavy ML deps ship 3.12+ syntax / large untyped stubs; we only type-check our
# own code, mirroring the existing engine-dep ignore policy. (M4: sentence-transformers)
[[tool.mypy.overrides]]
module = ["numpy.*", "torch.*", "transformers.*", "sentence_transformers.*", "pgvector.*", "scipy.*", "sklearn.*", "huggingface_hub.*"]
follow_imports = "skip"

# ML test suite ships its own untyped fixtures/mocks and is explicitly out of
# scope for this stabilization (see brief: "do not modify ... ML tests"). Skip
# strict checking there, mirroring the ML-dep stub-ignore policy above.
[[tool.mypy.overrides]]
module = ["tests.ml.*"]
follow_imports = "skip"
disable_error_code = ["union-attr", "arg-type", "misc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
# Function-scoped loop: every async fixture (engines, sessions, app_db) is built
# and torn down in the SAME per-test event loop. This is what prevents the
# pytest-asyncio "greenlet is being finalized" / "Task attached to a different
# loop" teardown crash — an asyncpg engine's pooled connections must be closed in
# the same loop that opened them. The two session-scoped fixtures (admin_engine,
# test_database) still run once in the session loop because they opt in explicitly.
asyncio_default_fixture_loop_scope = "function"
