[project]
name = "actready-api"
version = "0.1.0"
description = "ActReady — AI-governance evidence compiler: map evidence to ISO/IEC 42001 controls and EU AI Act obligations, output scored gap reports."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aarush Gutha" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "instructor>=1.4",
    "openai>=1.40",
    "pyyaml>=6.0",
    "rich>=13.7",
    "httpx>=0.27",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["yaml", "instructor", "openai", "fastapi.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
